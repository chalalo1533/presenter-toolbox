[package]
name = "presenter_toolbox"
version = "0.2.0"
edition = "2024"
description = "Zoom, dibujo, foco, clics y teclas en pantalla y grabación GIF para presentaciones en Windows y Linux"
license = "MIT"
repository = "https://github.com/chalalo1533/presenter-toolbox"

[[bin]]
name = "presenter_toolbox"
path = "src/main.rs"

[dependencies]
arboard = "3.7.0"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_UI_Magnification",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes", "shape", "xinput", "xtest", "randr"] }
ab_glyph = "0.2"
epaint_default_fonts = { version = "0.37", features = ["monochrome_emoji_fonts"] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
opt-level = 3
lto = "thin"
codegen-units = 4
