# Builds the downloads (Windows portable .zip, Linux .tar.gz and .deb) and publishes them as a
# GitHub Release whenever a tag like v0.2.0 is pushed.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # One build per architecture: Intel/AMD, and Windows on ARM (Snapdragon, Surface…).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            arch: win64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: win-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Windows on ARM has no native OpenGL driver, so a build that compiles can still
      # fail to draw anything. Starting it here and photographing its window with
      # PrintWindow (which asks the window to paint itself, so it works even when
      # something else covers the screen) is the only way to find that out.
      - name: Comprobar que arranca y dibuja su ventana
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class Win {
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h, IntPtr dc, uint flags);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
          }
          "@
          $exe = "target\${{ matrix.target }}\release\presenter_toolbox.exe"
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 25
          $p.Refresh()
          if ($p.HasExited) { throw "El programa se cerró solo (código $($p.ExitCode))" }
          $h = $p.MainWindowHandle
          if ($h -eq 0) { throw "Arrancó pero no abrió ventana: falló el contexto gráfico" }
          Write-Host "Ventana abierta: $($p.MainWindowTitle)"

          $r = New-Object Win+RECT
          [void][Win]::GetWindowRect($h, [ref]$r)
          $w = $r.Right - $r.Left; $hh = $r.Bottom - $r.Top
          Write-Host "Tamaño: ${w}x${hh}"
          $bmp = New-Object Drawing.Bitmap $w, $hh
          $g = [Drawing.Graphics]::FromImage($bmp)
          $dc = $g.GetHdc()
          [void][Win]::PrintWindow($h, $dc, 2)   # 2 = PW_RENDERFULLCONTENT, incluye lo pintado por la GPU
          $g.ReleaseHdc($dc)
          $bmp.Save("$pwd\smoke-${{ matrix.arch }}.png")
          Stop-Process -Id $p.Id -Force

          # Una ventana sin dibujar sale de un solo color; la nuestra tiene texto, iconos y botones.
          $first = $bmp.GetPixel(0, 0).ToArgb()
          $diff = 0; $total = 0
          for ($y = 0; $y -lt $hh; $y += 4) {
            for ($x = 0; $x -lt $w; $x += 4) {
              $total++
              if ($bmp.GetPixel($x, $y).ToArgb() -ne $first) { $diff++ }
            }
          }
          $pct = [math]::Round(100.0 * $diff / $total, 1)
          Write-Host "Pixeles distintos del fondo: $pct%"
          if ($pct -lt 5) { throw "La ventana salió en blanco ($pct%): el contexto gráfico no está dibujando" }

      - name: Guardar la captura
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.arch }}
          path: smoke-${{ matrix.arch }}.png
          if-no-files-found: ignore

      - name: Package portable zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $dir = "PresenterToolbox"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target\${{ matrix.target }}\release\presenter_toolbox.exe $dir
          Copy-Item packaging\LEEME.txt $dir
          "Configuración portable: mientras este archivo exista, los ajustes se guardan en esta carpeta." | Set-Content "$dir\portable.ini"
          $zip = "PresenterToolbox-$ver-portable-${{ matrix.arch }}.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash + "  " + $zip | Set-Content "$zip.sha256"
          "ZIP=$zip" | Out-File -Append $env:GITHUB_ENV

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
          generate_release_notes: true

  linux:
    # the oldest runner available, so the program also starts on older distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package tar.gz
        run: |
          ver="${GITHUB_REF_NAME#v}"
          dir="PresenterToolbox"
          mkdir "$dir"
          cp target/release/presenter_toolbox "$dir/"
          cp packaging/linux/LEEME.txt packaging/linux/install.sh packaging/linux/presenter-toolbox.desktop "$dir/"
          cp docs/icono.png "$dir/presenter-toolbox.png"
          chmod +x "$dir/presenter_toolbox" "$dir/install.sh"
          tgz="PresenterToolbox-$ver-linux-x86_64.tar.gz"
          tar -czf "$tgz" "$dir"
          sha256sum "$tgz" > "$tgz.sha256"
          echo "TGZ=$tgz" >> "$GITHUB_ENV"

      - name: Package .deb
        env:
          DEB_VERSION: ${{ github.ref_name }}
        run: |
          export DEB_VERSION="${DEB_VERSION#v}"
          deb=$(./packaging/linux/build-deb.sh target/release/presenter_toolbox .)
          sha256sum "$deb" > "$deb.sha256"
          echo "DEB=$deb" >> "$GITHUB_ENV"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.TGZ }}
            ${{ env.TGZ }}.sha256
            ${{ env.DEB }}
            ${{ env.DEB }}.sha256
