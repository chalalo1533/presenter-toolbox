# Builds the downloads (Windows portable .zip, Linux .tar.gz and .deb) and publishes them as a
# GitHub Release whenever a tag like v0.2.0 is pushed.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # One build per architecture: Intel/AMD, and Windows on ARM (Snapdragon, Surface…).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            arch: win64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: win-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Windows on ARM has no native OpenGL driver, so a build that compiles can still
      # fail to open a window. Starting it here is the only way to find that out.
      - name: Comprobar que arranca y abre su ventana
        shell: powershell
        run: |
          $exe = "target\${{ matrix.target }}\release\presenter_toolbox.exe"
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 25
          $p.Refresh()
          if ($p.HasExited) { throw "El programa se cerró solo (código $($p.ExitCode))" }
          if ($p.MainWindowHandle -eq 0) { throw "Arrancó pero no abrió ventana: falló el contexto gráfico" }
          Write-Host "Ventana abierta: $($p.MainWindowTitle)"
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = New-Object Drawing.Bitmap 1024, 768
            $g = [Drawing.Graphics]::FromImage($b)
            $g.CopyFromScreen(0, 0, 0, 0, $b.Size)
            $b.Save("$pwd\smoke-${{ matrix.arch }}.png")
          } catch { Write-Host "Sin captura: $_" }
          Stop-Process -Id $p.Id -Force

      - name: Guardar la captura
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.arch }}
          path: smoke-${{ matrix.arch }}.png
          if-no-files-found: ignore

      - name: Package portable zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $dir = "PresenterToolbox"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target\${{ matrix.target }}\release\presenter_toolbox.exe $dir
          Copy-Item packaging\LEEME.txt $dir
          "Configuración portable: mientras este archivo exista, los ajustes se guardan en esta carpeta." | Set-Content "$dir\portable.ini"
          $zip = "PresenterToolbox-$ver-portable-${{ matrix.arch }}.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash + "  " + $zip | Set-Content "$zip.sha256"
          "ZIP=$zip" | Out-File -Append $env:GITHUB_ENV

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
          generate_release_notes: true

  linux:
    # the oldest runner available, so the program also starts on older distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package tar.gz
        run: |
          ver="${GITHUB_REF_NAME#v}"
          dir="PresenterToolbox"
          mkdir "$dir"
          cp target/release/presenter_toolbox "$dir/"
          cp packaging/linux/LEEME.txt packaging/linux/install.sh packaging/linux/presenter-toolbox.desktop "$dir/"
          cp docs/icono.png "$dir/presenter-toolbox.png"
          chmod +x "$dir/presenter_toolbox" "$dir/install.sh"
          tgz="PresenterToolbox-$ver-linux-x86_64.tar.gz"
          tar -czf "$tgz" "$dir"
          sha256sum "$tgz" > "$tgz.sha256"
          echo "TGZ=$tgz" >> "$GITHUB_ENV"

      - name: Package .deb
        env:
          DEB_VERSION: ${{ github.ref_name }}
        run: |
          export DEB_VERSION="${DEB_VERSION#v}"
          deb=$(./packaging/linux/build-deb.sh target/release/presenter_toolbox .)
          sha256sum "$deb" > "$deb.sha256"
          echo "DEB=$deb" >> "$GITHUB_ENV"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.TGZ }}
            ${{ env.TGZ }}.sha256
            ${{ env.DEB }}
            ${{ env.DEB }}.sha256
